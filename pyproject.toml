[project]
name = "gan-mnist"
version = "0.1.0"
description = "GAN explicada: red Generadora, red Discriminadora y funciones de perdida (MNIST / Fashion-MNIST)"
readme = "README.md"
authors = [
    { name = "Cristian335-creaty", email = "65791823+Cristian335-creaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.scripts]
gan-mnist = "gan_mnist:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"
